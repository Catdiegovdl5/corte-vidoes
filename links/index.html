    <style>
        /* Variables from our main cyberpunk theme */
        :root {
            --bg-base: #050505;
            --bg-surface: #0a0a0c;
            --neon-red: #ff003c;
            --text-main: #f8f8f2;
            --cyber-blue: #00f0ff;
            --border-dim: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            background-image: 
                linear-gradient(rgba(255, 0, 60, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 60, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* Avatar */
        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 1.5rem;
        }
        
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-red);
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.4);
            position: relative;
            z-index: 2;
        }

        /* Glitch Effect Name */
        .glitch-wrapper { position: relative; display: inline-block; margin-bottom: 0.5rem; }
        .glitch {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            position: relative;
            color: var(--text-main);
            letter-spacing: 1px;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.8;
        }
        .glitch::before { left: 2px; text-shadow: -2px 0 var(--neon-red); animation: glitch-anim 2s infinite linear alternate-reverse; }
        .glitch::after { left: -2px; text-shadow: -2px 0 var(--cyber-blue); animation: glitch-anim 3s infinite linear alternate-reverse; }

        @keyframes glitch-anim {
            0% { clip: rect(44px, 9999px, 11px, 0); }
            100% { clip: rect(15px, 9999px, 40px, 0); }
        }

        .bio {
            font-family: 'Fira Code', monospace;
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 3rem;
        }

        /* Links/Buttons */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .link-btn {
            display: block;
            background-color: var(--bg-surface);
            color: var(--text-main);
            text-decoration: none;
            padding: 1.2rem;
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            border: 1px solid var(--border-dim);
            transition: all 0.3s ease;
            position: relative;
            /* Brutalist corners */
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .link-btn:hover {
            background-color: #000;
            border-color: var(--neon-red);
            color: var(--neon-red);
            box-shadow: 0 0 20px rgba(255,0,60,0.3);
            transform: scale(1.02);
        }

        /* Social Icons Footer */
        .social-footer {
            margin-top: 3rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .social-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background: var(--bg-surface);
            border: 1px solid var(--border-dim);
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: 4px; /* Slightly brutalist */
        }

        .social-icon:hover {
            border-color: var(--neon-red);
            background: rgba(255,0,60,0.1);
            color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255,0,60,0.4);
            transform: translateY(-5px);
        }
        
        .social-icon svg { width: 22px; height: 22px; fill: currentColor; }
    </style>
</head>
